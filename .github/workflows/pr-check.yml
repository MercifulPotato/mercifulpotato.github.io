name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'ga'

      - name: Show .NET info
        run: dotnet --info

      - name: Verify a stable .NET SDK was selected
        run: |
          version="$(dotnet --version)"
          echo "Using .NET SDK ${version}"
          case "${version}" in
            *-*) echo "::error::Prerelease SDK ${version} was selected; CI must build with the latest stable SDK"; exit 1 ;;
          esac

      - name: Restore dependencies
        run: dotnet restore

      - name: Run content processor
        run: dotnet run --project tools/ObserverMagazine.ContentProcessor -- --content-dir content/blog --output-dir src/ObserverMagazine.Web/wwwroot --authors-dir content/authors

      - name: Run tests
        run: dotnet test --solution ObserverMagazine.slnx --no-restore --timeout 10m

      - name: Publish Blazor WASM
        run: dotnet publish src/ObserverMagazine.Web/ObserverMagazine.Web.csproj -c Release -o publish

      - name: Setup Python 3.12 (boot smoke test)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-smoke.txt

      - name: Install Playwright Chromium
        run: |
          pip install -r tools/requirements-smoke.txt
          python -m playwright install --with-deps chromium

      - name: Boot smoke test (published site in headless Chromium)
        run: python tools/boot_smoke_test.py --site-dir publish/wwwroot

      - name: Prepare preview
        run: |
          touch publish/wwwroot/.nojekyll
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Upload preview site
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: publish/wwwroot
          retention-days: 7
